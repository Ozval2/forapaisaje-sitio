<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORA · Arquitectura del Paisaje</title>
<meta name="description" content="FORA, estudio de arquitectura del paisaje en Cuenca, Ecuador. Diseñamos el comienzo. El tiempo continúa la obra.">
<meta property="og:title" content="FORA · Arquitectura del Paisaje">
<meta property="og:description" content="Diseñamos el comienzo. El tiempo continúa la obra.">
<meta name="theme-color" content="#231F20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fora.css">
<style>
:root{--piedra:#231F20;--crema:#F4EFE4;--suave:#E4DED2;--gris:#A9A397;--linea:rgba(244,239,228,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--piedra);color:var(--crema);font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 32px}
.logo-svg{display:block;width:clamp(230px,26vw,330px);height:auto}
.frase{font-family:"Fora Display",Inter,sans-serif;font-weight:300;text-transform:lowercase;font-size:clamp(16.5px,1.865vw,23.7px);line-height:1.6;color:#B8B2A6;margin-top:56px;max-width:420px}
nav{display:flex;gap:44px;margin-top:64px;flex-wrap:wrap;justify-content:center}
nav a{color:var(--crema);font-size:11px;letter-spacing:.34em;text-transform:uppercase;text-decoration:none;padding:12px 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav a:hover{border-color:var(--linea)}
footer{text-align:center;padding:0 24px 40px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gris);line-height:2.2}
footer a{color:inherit;text-decoration:none}
@media(max-width:600px){nav{gap:28px}.frase{margin-top:44px}}
</style>
</head>
<body>
<main>
  <h1><img class="logo-svg" src="/logo-fora.svg" alt="FORA arquitectura del paisaje"></h1>
  <p class="frase">diseñamos el comienzo.<br>el tiempo continúa la obra.</p>
  <nav>
    <a href="/origen/">Origen</a>
    <a href="https://www.instagram.com/fora_paisajismo/" rel="noopener">Instagram</a>
    <a href="mailto:hola@forapaisaje.com">Escríbenos</a>
  </nav>
</main>
<footer>Cuenca · Ecuador<br><a href="mailto:hola@forapaisaje.com">hola@forapaisaje.com</a></footer>
</body>
</html>
