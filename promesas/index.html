<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promesas · FORA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231F20">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fora.css">
<style>
:root{--piedra:#231F20;--crema:#F4EFE4;--suave:#E4DED2;--gris:#A9A397;--desc:#B8B2A6;--linea:rgba(244,239,228,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--piedra);color:var(--crema);font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:center;padding:40px 24px 0}
.top img{height:30px;width:auto;display:block}
.aviso{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-top:18px}
main{max-width:880px;margin:0 auto;padding:clamp(72px,14vh,160px) 24px 96px}
.grupo{display:grid;grid-template-columns:28px 1fr;gap:20px;margin-bottom:64px}
.grupo .et{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);align-self:start}
.lista{font-family:"Fora Display",Inter,sans-serif;text-transform:lowercase;font-size:clamp(18px,1.9vw,24px);line-height:1.7;color:var(--crema);max-width:640px}
.lista a{display:inline;transition:opacity .3s}
.lista sup{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.1em;color:var(--gris);vertical-align:top;position:relative;top:.55em;margin-right:3px}
.lista .p{color:var(--desc)}
.lista:hover a{opacity:.35}.lista a:hover{opacity:1}
#prev{position:fixed;width:300px;aspect-ratio:4/3;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;background-size:cover;background-position:center}
nav.pie{display:flex;justify-content:center;gap:44px;padding:0 24px 56px;flex-wrap:wrap}
nav.pie a{font-size:11px;letter-spacing:.34em;text-transform:uppercase;padding:12px 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav.pie a:hover{border-color:var(--linea)}
/* ficha */
#ficha{position:fixed;inset:0;background:var(--piedra);z-index:10;display:none;grid-template-columns:minmax(240px,300px) 1fr}
#ficha.on{display:grid}
.col{padding:40px 32px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--linea);overflow:auto}
.col h2{font-family:"Fora Display",Inter,sans-serif;font-weight:300;text-transform:lowercase;font-size:34px;line-height:1.1}
.datos{margin-top:40px}
.datos dt{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-top:20px}
.datos dd{font-size:13px;letter-spacing:.04em;line-height:1.8;color:var(--suave)}
.lugar{font-size:13px;line-height:2;letter-spacing:.04em;color:var(--suave);margin-top:40px}
.cerrar{font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin-top:40px;background:none;border:0;color:var(--crema);cursor:pointer;text-align:left;font-family:inherit}
.tira{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;height:100vh;padding:40px 40px 40px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.cuadro{flex:0 0 auto;height:auto;align-self:center;aspect-ratio:16/9;width:min(calc(100vw - 400px),calc((100vh - 80px)*16/9));background-size:cover;background-position:center;scroll-snap-align:start;position:relative}
.cuadro span{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,239,228,.7)}
.flechas[hidden]{display:none!important}
.flechas{position:fixed;right:28px;bottom:24px;display:flex;gap:10px;z-index:11}
.flechas button{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:rgba(35,31,32,.6);color:var(--crema);font-size:16px;cursor:pointer}
@media(max-width:760px){
  #ficha.on{display:block;overflow-y:auto}
  .col{border-right:0;border-bottom:1px solid var(--linea);padding:28px 24px}
  .tira{height:62vh;padding:16px 24px}
  .flechas{display:none}
  nav.pie{gap:28px}
  #prev{display:none}
}
@media(max-width:760px){.cuadro{max-width:none;height:auto;width:86vw}.tira{height:auto;padding:16px 24px;scroll-padding-left:24px}}
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="FORA, inicio"><img src="/logo-fora-palabra.svg" alt="Fora"></a></header>
<p class="aviso">borrador</p>
<main>
  <section class="grupo"><span class="et">promesas</span><p class="lista" id="proyectos"></p></section>
</main>
<nav class="pie"><a href="/">Inicio</a><a href="https://www.instagram.com/fora_paisajismo/" rel="noopener">Instagram</a><a href="mailto:hola@forapaisaje.com">Escríbenos</a></nav>
<div id="prev"></div>

<section id="ficha" aria-modal="true" role="dialog">
  <div class="col">
    <div>
      <h2 id="f-nombre"></h2>
      <dl class="datos">
        <dt>año</dt><dd id="f-anio"></dd>
        <dt>tipo</dt><dd id="f-tipo"></dd>
        <dt>estado</dt><dd>Render</dd>
      </dl>
      <p class="lugar" id="f-texto"></p>
    </div>
    <button class="cerrar" id="cerrar">← promesas</button>
  </div>
  <div class="tira" id="tira"></div>
</section>
<div class="flechas" id="flechas" hidden><button id="ant" aria-label="anterior">←</button><button id="sig" aria-label="siguiente">→</button></div>

<script>
// cada promesa: siglas del proyecto (nunca nombres de clientes), año y sus renders
const J=[
 {id:'inh-2024',n:'INH.',a:2024,t:'Glamping',x:'Domos blancos en medio del bosque. Caminos de piedra, agua quieta y plantas nativas que esconden la arquitectura.',r:['2024-inh-1','2024-inh-2','2024-inh-3','2024-inh-4','2024-inh-5','2024-inh-6']},
 {id:'cl-2024',n:'C.L.',a:2024,t:'Residencial',x:'Una casa abierta a las montañas. Un fogón circular, un huerto entre árboles y taludes cubiertos de perennes.',r:['2024-cl-1','2024-cl-2','2024-cl-3','2024-cl-4','2024-cl-5','2024-cl-6']},
 {id:'ct-2024',n:'C.T.',a:2024,t:'Residencial',x:'Una casa de vidrio y madera. El jardín entra por la escalera y termina en una terraza frente a la cordillera.',r:['2024-ct-1','2024-ct-2','2024-ct-3','2024-ct-4','2024-ct-5','2024-ct-6']},
 {id:'mv-2024',n:'M.V.',a:2024,t:'Residencial',x:'Un patio de grava alrededor de un árbol solo. Borde de flores, césped largo y el valle detrás.',r:['2024-mv-1','2024-mv-2','2024-mv-3','2024-mv-4','2024-mv-5','2024-mv-6']},
 {id:'pp-2024',n:'P.P.',a:2024,t:'Residencial',x:'Ladrillo, hiedra y lavanda. Un jardín de rincones con sombra y luz de tarde.',r:['2024-pp-1','2024-pp-2','2024-pp-3','2024-pp-4','2024-pp-5','2024-pp-6']},
 {id:'tm-2024',n:'T.M.',a:2024,t:'Residencial',x:'Un muro verde, árboles de hoja roja y salvias. Un patio pequeño que se siente como bosque.',r:['2024-tm-1','2024-tm-2','2024-tm-3','2024-tm-4','2024-tm-5','2024-tm-6']},
 {id:'js-2023',n:'J.S.',a:2023,t:'Residencial',x:'Una casa de campo entre sauces y un lago. Senderos de grava, un jacuzzi de piedra y un huerto abierto al valle.',r:['2023-js-1','2023-js-2','2023-js-3','2023-js-4','2023-js-5','2023-js-6']},
 {id:'mm-2023',n:'M.M.',a:2023,t:'Residencial',x:'Un jardín hecho alrededor de árboles viejos que se conservaron. Lajas redondas, rocas y flores de borde bajo copas anchas.',r:['2023-mm-1','2023-mm-2','2023-mm-3','2023-mm-4','2023-mm-5','2023-mm-6']},
 {id:'dlb-2023',n:'D.L.B.',a:2023,t:'Residencial',x:'Una casa de hormigón dentro del bosque. Un arroyo seco de piedras, un fogón circular y gramíneas que llegan hasta la puerta.',r:['2023-dlb-1','2023-dlb-2','2023-dlb-3','2023-dlb-4','2023-dlb-5','2023-dlb-6']},
 {id:'sc-2023',n:'S.C.',a:2023,t:'Residencial',x:'Una casa oscura entre árboles altos. Gradas de césped, jardineras de hormigón y un patio interior con agua.',r:['2023-sc-1','2023-sc-2','2023-sc-3','2023-sc-4','2023-sc-5','2023-sc-6']},
 {id:'ec-2023',n:'E.C.',a:2023,t:'Residencial',x:'Una casa en el bosque abierta a un estanque. Piedras grandes, plantas de agua y un árbol solo en la llegada.',r:['2023-ec-1','2023-ec-2','2023-ec-3','2023-ec-4','2023-ec-5','2023-ec-6']},
 {id:'ge-2023',n:'G.E.',a:2023,t:'Residencial',x:'Palmeras, helechos y senderos curvos. Un jardín de clima cálido que entra hasta la terraza.',r:['2023-ge-1','2023-ge-2','2023-ge-3','2023-ge-4','2023-ge-5','2023-ge-6']},
 {id:'cmo-2022',n:'C.MO.',a:2022,t:'Residencial',x:'Una casa en la ladera sostenida por muros de piedra. Un fogón hundido en el césped y perennes que suben con el terreno.',r:['2022-cmo-1','2022-cmo-2','2022-cmo-3','2022-cmo-4','2022-cmo-5','2022-cmo-6']},
 {id:'cch-2022',n:'C.CH.',a:2022,t:'Residencial',x:'Casas de techo alto entre pinos. Un estanque, dos fogones bajo los árboles y un bosque que se deja como está.',r:['2022-cch-1','2022-cch-2','2022-cch-3','2022-cch-4','2022-cch-5','2022-cch-6']},
 {id:'sp-2022',n:'S.P.',a:2022,t:'Residencial',x:'Cerezos, piedras grandes y caminos de lajas sobre el césped. Un jardín que cambia de color con cada estación.',r:['2022-sp-1','2022-sp-2','2022-sp-3','2022-sp-4','2022-sp-5','2022-sp-6']},
 {id:'cm-2022',n:'C.M.',a:2022,t:'Residencial',x:'Una casa de corredores y arcos. Lavandas y salvias acompañan el recorrido, y el patio central guarda un solo árbol.',r:['2022-cm-1','2022-cm-2','2022-cm-3','2022-cm-4','2022-cm-5','2022-cm-6']},
 {id:'mc-2022',n:'M.C.',a:2022,t:'Terraza',x:'Una terraza sobre la ciudad. Deck de madera, fuego y jardineras que enmarcan las montañas al atardecer.',r:['2022-mc-1','2022-mc-2','2022-mc-3','2022-mc-4','2022-mc-5','2022-mc-6']},
 {id:'ev-2021',n:'E.V.',a:2021,t:'Residencial',x:'Una casa de ladrillo y hormigón asentada en la ladera. Patios de grava, helechos y árboles que se ven a través del vidrio.',r:['2021-ev-1','2021-ev-2','2021-ev-3','2021-ev-4','2021-ev-5','2021-ev-6']},
 {id:'lu-2021',n:'L.U.',a:2021,t:'Residencial',x:'Una casa en terrazas abierta a las montañas. Bordes de perennes que bajan con la pendiente hasta el césped.',r:['2021-lu-1','2021-lu-2','2021-lu-3','2021-lu-4','2021-lu-5']},
 {id:'ind-2021',n:'IND.',a:2021,t:'Industrial',x:'Una nave industrial rodeada de bosque. El acceso se vuelve paseo y los árboles de copa ancha suavizan la escala.',r:['2021-ind-1','2021-ind-2','2021-ind-3','2021-ind-4','2021-ind-5']}
];
function lista(el,arr){
  el.innerHTML=arr.map((j,i)=>`<a href="#${j.id}" data-id="${j.id}">${i===0||arr[i-1].a!==j.a?`<sup>${j.a}</sup>`:''}${j.n}</a><span class="p">${i<arr.length-1?', ':(j.n.endsWith('.')?'':'.')}</span>`).join('');
}
lista(document.getElementById('proyectos'),[...J].sort((a,b)=>a.a-b.a));
const url=f=>`/promesas/${f}.jpg`;
// vista previa al pasar: el primer render
const prev=document.getElementById('prev');
document.querySelectorAll('.lista a').forEach(a=>{
  const j=J.find(x=>x.id===a.dataset.id);
  a.addEventListener('mouseenter',()=>{prev.style.backgroundImage=`url(${url(j.r[0])})`;prev.style.opacity=1});
  a.addEventListener('mouseleave',()=>prev.style.opacity=0);
  a.addEventListener('mousemove',e=>{prev.style.left=(e.clientX+24)+'px';prev.style.top=(e.clientY-120)+'px'});
});
const ficha=document.getElementById('ficha'),tira=document.getElementById('tira'),fl=document.getElementById('flechas');
function abrir(id){
  const j=J.find(x=>x.id===id); if(!j) return cerrar();
  document.getElementById('f-nombre').textContent=j.n;
  document.getElementById('f-anio').textContent=j.a;
  document.getElementById('f-tipo').textContent=j.t;
  document.getElementById('f-texto').textContent=j.x;
  tira.innerHTML=j.r.map((f,i)=>`<div class="cuadro" role="img" aria-label="render ${j.n} ${i+1}" style="background-image:url(${url(f)})"><span>${String(i+1).padStart(2,'0')} / ${String(j.r.length).padStart(2,'0')}</span></div>`).join('');
  ficha.classList.add('on'); tira.scrollTo({left:0,behavior:'instant'}); requestAnimationFrame(()=>tira.scrollTo({left:0,behavior:'instant'})); fl.hidden=j.r.length<2; document.body.style.overflow='hidden';
  document.title=j.n+' · Promesas · FORA';
}
function cerrar(){tira.scrollTo({left:0,behavior:'instant'});ficha.classList.remove('on');fl.hidden=true;document.body.style.overflow='';document.title='Promesas · FORA';if(location.hash)history.pushState('',document.title,location.pathname)}
window.addEventListener('hashchange',()=>location.hash?abrir(location.hash.slice(1)):cerrar());
if(location.hash) abrir(location.hash.slice(1));
document.getElementById('cerrar').onclick=cerrar;
document.addEventListener('keydown',e=>{if(!ficha.classList.contains('on'))return;if(e.key==='Escape')cerrar();if(e.key==='ArrowRight')tira.scrollBy({left:innerWidth*.6,behavior:'smooth'});if(e.key==='ArrowLeft')tira.scrollBy({left:-innerWidth*.6,behavior:'smooth'})});
document.getElementById('sig').onclick=()=>tira.scrollBy({left:innerWidth*.6,behavior:'smooth'});
document.getElementById('ant').onclick=()=>tira.scrollBy({left:-innerWidth*.6,behavior:'smooth'});
tira.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&innerWidth>760){tira.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
</script>
</body>
</html>
