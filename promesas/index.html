<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promesas · FORA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231F20">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fora.css">
<style>
:root{--piedra:#231F20;--crema:#F4EFE4;--suave:#E4DED2;--gris:#A9A397;--desc:#B8B2A6;--linea:rgba(244,239,228,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--piedra);color:var(--crema);font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:center;padding:40px 24px 0}
.top img{height:30px;width:auto;display:block}
.aviso{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-top:18px}
main{max-width:880px;margin:0 auto;padding:clamp(72px,14vh,160px) 24px 96px}
.grupo{display:grid;grid-template-columns:28px 1fr;gap:20px;margin-bottom:64px}
.grupo .et{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);align-self:start}
.lista{font-family:"Fora Display",Inter,sans-serif;text-transform:lowercase;font-size:clamp(18px,1.9vw,24px);line-height:1.7;color:var(--crema);max-width:640px}
.lista a{display:inline;transition:opacity .3s}
.lista sup{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.1em;color:var(--gris);vertical-align:top;position:relative;top:.55em;margin-right:3px}
.lista .p{color:var(--desc)}
.lista:hover a{opacity:.35}.lista a:hover{opacity:1}
#prev{position:fixed;width:300px;aspect-ratio:4/3;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;background-size:cover;background-position:center}
nav.pie{display:flex;justify-content:center;gap:44px;padding:0 24px 56px;flex-wrap:wrap}
nav.pie a{font-size:11px;letter-spacing:.34em;text-transform:uppercase;padding:12px 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav.pie a:hover{border-color:var(--linea)}
/* ficha */
#ficha{position:fixed;inset:0;background:var(--piedra);z-index:10;display:none;grid-template-columns:minmax(240px,300px) 1fr}
#ficha.on{display:grid}
.col{padding:40px 32px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--linea);overflow:auto}
.col h2{font-family:"Fora Display",Inter,sans-serif;font-weight:300;text-transform:lowercase;font-size:34px;line-height:1.1}
.datos{margin-top:40px}
.datos dt{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-top:20px}
.datos dd{font-size:13px;letter-spacing:.04em;line-height:1.8;color:var(--suave)}
.lugar{font-size:13px;line-height:2;letter-spacing:.04em;color:var(--suave);margin-top:40px}
.cerrar{font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin-top:40px;background:none;border:0;color:var(--crema);cursor:pointer;text-align:left;font-family:inherit}
.tira{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;height:100vh;padding:40px 40px 40px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.cuadro{flex:0 0 auto;height:auto;align-self:center;aspect-ratio:16/9;width:min(calc(100vw - 400px),calc((100vh - 80px)*16/9));background-size:cover;background-position:center;scroll-snap-align:start;position:relative}
.cuadro span{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,239,228,.7)}
.flechas[hidden]{display:none!important}
.flechas{position:fixed;right:28px;bottom:24px;display:flex;gap:10px;z-index:11}
.flechas button{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:rgba(35,31,32,.6);color:var(--crema);font-size:16px;cursor:pointer}
@media(max-width:760px){
  #ficha.on{display:block;overflow-y:auto}
  .col{border-right:0;border-bottom:1px solid var(--linea);padding:28px 24px}
  .tira{height:62vh;padding:16px 24px}
  .flechas{display:none}
  nav.pie{gap:28px}
  #prev{display:none}
}
@media(max-width:760px){.cuadro{max-width:none;height:auto;width:86vw}.tira{height:auto;padding:16px 24px;scroll-padding-left:24px}}
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="FORA, inicio"><img src="/logo-fora-palabra.svg" alt="Fora"></a></header>
<p class="aviso">borrador</p>
<main>
  <section class="grupo"><span class="et">promesas</span><p class="lista" id="proyectos"></p></section>
</main>
<nav class="pie"><a href="/">Inicio</a><a href="https://www.instagram.com/fora_paisajismo/" rel="noopener">Instagram</a><a href="mailto:hola@forapaisaje.com">Escríbenos</a></nav>
<div id="prev"></div>

<section id="ficha" aria-modal="true" role="dialog">
  <div class="col">
    <div>
      <h2 id="f-nombre"></h2>
      <dl class="datos">
        <dt>año</dt><dd id="f-anio"></dd>
        <dt>tipo</dt><dd id="f-tipo"></dd>
        <dt>estado</dt><dd>Render</dd>
      </dl>
      <p class="lugar" id="f-texto"></p>
    </div>
    <button class="cerrar" id="cerrar">← promesas</button>
  </div>
  <div class="tira" id="tira"></div>
</section>
<div class="flechas" id="flechas" hidden><button id="ant" aria-label="anterior">←</button><button id="sig" aria-label="siguiente">→</button></div>

<script>
// cada promesa: siglas del proyecto (nunca nombres de clientes), año y sus renders
const J=[
 {id:'ya-2026',n:'Y.A.',a:2026,t:'Residencial',x:'El bosque húmedo entra hasta la puerta. Helechos y flores rojas bajo copas altas, un fogón hundido y caminos de adoquín que siguen la curva del terreno.',r:['2026-ya-1','2026-ya-2','2026-ya-3','2026-ya-4','2026-ya-5','2026-ya-6']},
 {id:'dc-2026',n:'D.C.',a:2026,t:'Residencial',x:'Una casa de vidrio sobre un terreno que cae. Muros de piedra contienen la pendiente y se cubren de flores, islas de plantación flotan en la grava y una fila de cipreses cierra el jardín.',r:['2026-dc-1','2026-dc-2','2026-dc-3','2026-dc-4','2026-dc-5','2026-dc-6']},
 {id:'dv-2026',n:'D.V.',a:2026,t:'Residencial',x:'Un jardín de flores en cascada. Gradas de ladrillo sobre muros de piedra, senderos de grava que bajan entre masas de color y una galería abierta desde donde se mira todo.',r:['2026-dv-1','2026-dv-2','2026-dv-3','2026-dv-4','2026-dv-5','2026-dv-6']},
 {id:'sn-2026',n:'S.N.',a:2026,t:'Residencial',x:'Casa blanca de tejas, jardín de altura y luz. Árboles de copa plana, palmeras en el eje de la fachada, piedras grandes entre helechos y hortensias azules a la sombra.',r:['2026-sn-1','2026-sn-2','2026-sn-3','2026-sn-4','2026-sn-5','2026-sn-6']},
 {id:'cg-2026',n:'C.G.',a:2026,t:'Café',x:'Un café que es, ante todo, un jardín. Mesas bajo árboles viejos, cipreses como columnas y una base de agaves y plantas plateadas que piden poca agua.',r:['2026-cg-1','2026-cg-2','2026-cg-3','2026-cg-4','2026-cg-5','2026-cg-6']},
 {id:'ca-2026',n:'C.A.',a:2026,t:'Residencial',x:'Un jardín de un solo gesto: la curva. El césped se ondula entre muros de hiedra, las flores azules dibujan el borde y unas piedras blancas invitan a sentarse.',r:['2026-ca-1','2026-ca-2','2026-ca-3','2026-ca-4','2026-ca-5','2026-ca-6']},
 {id:'jcr-2026',n:'J.C.R.',a:2026,t:'Residencial',x:'Un sendero de grava que sube desde la casa y se pierde entre los árboles. Gradas de adoquín en marcos de acero, plumeros de cortadera, gramíneas rosadas y espigas rojas acompañan el paso.',r:['2026-jcr-1','2026-jcr-2','2026-jcr-3','2026-jcr-4']},
 {id:'as-2025',n:'A.S.',a:2025,t:'Retiro',x:'Un jardín para estar en silencio. Senderos de piedra que se curvan sin prisa bajo árboles viejos, bancas para detenerse y un pabellón de madera abierto al agua.',r:['2025-as-1','2025-as-2','2025-as-3','2025-as-4','2025-as-5','2025-as-6']},
 {id:'dr-2025',n:'D.R.',a:2025,t:'Residencial',x:'La pendiente se vuelve recorrido. Gradas de piedra entre hortensias y salvias, muros cubiertos de enredaderas, lajas sueltas sobre el césped y un fogón recogido por una banca curva.',r:['2025-dr-1','2025-dr-2','2025-dr-3','2025-dr-4','2025-dr-5','2025-dr-6']},
 {id:'zp-2025',n:'Z.P.',a:2025,t:'Residencial',x:'Arquitectura de piedra clara, jardín de gramíneas. Texturas finas que se mueven con el viento, salvias moradas al pie de los muros y una terraza de macetas escultóricas con árboles de copa abierta.',r:['2025-zp-1','2025-zp-2','2025-zp-3','2025-zp-4','2025-zp-5','2025-zp-6']},
 {id:'lz-2025',n:'L.Z.',a:2025,t:'Residencial',x:'Influencia japonesa en clave andina. Boj en esferas, piedras planas y fuego sobre grava; en el patio, un solo árbol hace de pintura.',r:['2025-lz-1','2025-lz-2','2025-lz-3','2025-lz-4','2025-lz-5','2025-lz-6']},
 {id:'bp-2025',n:'B.P.',a:2025,t:'Residencial',x:'Cipreses que flanquean la entrada como columnas y repiten su ritmo a lo largo del muro verde. Bordes de flores magenta y moradas, un árbol solo sobre su isla de piedra y un fogón recogido en una curva de grava.',r:['2025-bp-1','2025-bp-2','2025-bp-3','2025-bp-4','2025-bp-5','2025-bp-6']},
 {id:'cr-2025',n:'C.R.',a:2025,t:'Residencial',x:'Una casa de muros que se resuelve en patios. Setos y hiedra cierran cada cuarto exterior: una sala sobre madera bajo árboles en flor, un patio de piedras y lavandas alrededor de un árbol y un jacuzzi a la sombra del alero.',r:['2025-cr-1','2025-cr-2','2025-cr-3','2025-cr-4','2025-cr-5','2025-cr-6']},
 {id:'inh-2024',n:'INH.',a:2024,t:'Glamping',x:'La arquitectura es efímera; el jardín la ancla. Planos de piedra, agua quieta y vegetación nativa hacen que el domo se sienta posado, no construido.',r:['2024-inh-1','2024-inh-2','2024-inh-3','2024-inh-4','2024-inh-5','2024-inh-6']},
 {id:'cl-2024',n:'C.L.',a:2024,t:'Residencial',x:'Un jardín que se recorre por niveles. Una banca curva abraza el fuego, senderos de grava atraviesan masas de perennes y gramíneas, y bajo los árboles la huerta crece en cajones elevados.',r:['2024-cl-1','2024-cl-2','2024-cl-3','2024-cl-4','2024-cl-5','2024-cl-6']},
 {id:'ct-2024',n:'C.T.',a:2024,t:'Residencial',x:'Vidrio, madera y una escalera que se vuelve jardín. Un muro verde y follaje grande entran por el centro de la casa; afuera, salvias y gramíneas bordean el césped y una terraza de madera con asientos como piedras blancas.',r:['2024-ct-1','2024-ct-2','2024-ct-3','2024-ct-4','2024-ct-5','2024-ct-6']},
 {id:'mv-2024',n:'M.V.',a:2024,t:'Residencial',x:'Un patio de grava sin adornos y un solo árbol en su anillo de piedra. Alrededor, bordes de salvias y perennes en tonos morados, un estanque entre rocas y un césped largo que deja respirar la casa.',r:['2024-mv-1','2024-mv-2','2024-mv-3','2024-mv-4','2024-mv-5','2024-mv-6']},
 {id:'pp-2024',n:'P.P.',a:2024,t:'Residencial',x:'Un jardín de cuartos. Ladrillo, hiedra y lavanda arman rincones con distinta luz: la sala junto al fuego, el huerto en cajones, el paso entre muros verdes.',r:['2024-pp-1','2024-pp-2','2024-pp-3','2024-pp-4','2024-pp-5','2024-pp-6']},
 {id:'tm-2024',n:'T.M.',a:2024,t:'Residencial',x:'Un patio pequeño que se lee como claro de bosque. El muro verde cierra, los árboles de hoja roja dan el contrapunto y las salvias suavizan la línea recta.',r:['2024-tm-1','2024-tm-2','2024-tm-3','2024-tm-4','2024-tm-5','2024-tm-6']},
 {id:'js-2023',n:'J.S.',a:2023,t:'Residencial',x:'Un jardín de llanura con una sola geometría: el círculo. Lo repiten el jacuzzi, el árbol en su isla de grava y la orilla del lago; los sauces ponen sombra y movimiento.',r:['2023-js-1','2023-js-2','2023-js-3','2023-js-4','2023-js-5','2023-js-6']},
 {id:'mm-2023',n:'M.M.',a:2023,t:'Residencial',x:'Árboles de copa escultórica colocados como piezas, cada uno con su lugar. Caminos curvos de grava y lajas redondas los enlazan con un jardín de rocas, una huerta en cajones junto a la mesa y un patio que gira alrededor de un solo árbol.',r:['2023-mm-1','2023-mm-2','2023-mm-3','2023-mm-4','2023-mm-5','2023-mm-6']},
 {id:'dlb-2023',n:'D.L.B.',a:2023,t:'Residencial',x:'Un arroyo seco atraviesa el césped y lleva la mirada al bosque. Rocas grandes, gramíneas sueltas y un fogón de piedra hacen que la casa parezca haber llegado después.',r:['2023-dlb-1','2023-dlb-2','2023-dlb-3','2023-dlb-4','2023-dlb-5','2023-dlb-6']},
 {id:'sc-2023',n:'S.C.',a:2023,t:'Residencial',x:'Una casa oscura pide un jardín de sombras. Gradas de césped que bajan como anfiteatro, jardineras de hormigón y un patio interior donde el agua guarda silencio.',r:['2023-sc-1','2023-sc-2','2023-sc-3','2023-sc-4','2023-sc-5','2023-sc-6']},
 {id:'ec-2023',n:'E.C.',a:2023,t:'Residencial',x:'El agua es el centro. Un estanque abraza la casa con pasos de piedra sobre su superficie, y la llegada se resuelve con un árbol solo en su isla de adoquín.',r:['2023-ec-1','2023-ec-2','2023-ec-3','2023-ec-4','2023-ec-5','2023-ec-6']},
 {id:'ge-2023',n:'G.E.',a:2023,t:'Residencial',x:'Un jardín de sombra y contraste. Palmeras y helechos bajo copas amplias, masas de flores moradas y rojas, un sendero curvo que cruza un pequeño puente y una sala que se abre bajo el árbol.',r:['2023-ge-1','2023-ge-2','2023-ge-3','2023-ge-4','2023-ge-5','2023-ge-6']},
 {id:'cmo-2022',n:'C.MO.',a:2022,t:'Residencial',x:'El muro de piedra sostiene la ladera y el jardín la habita. Esferas de boj, hojas en espada y masas de salvia y lavanda se escalonan a su pie; al centro, un fogón hundido en el césped recoge el lugar.',r:['2022-cmo-1','2022-cmo-2','2022-cmo-3','2022-cmo-4','2022-cmo-5','2022-cmo-6']},
 {id:'cch-2022',n:'C.CH.',a:2022,t:'Residencial',x:'Arquitectura de techos afilados, jardín de formas redondas. Un muro verde recibe la llegada, esferas de boj y helechos bajan con las gradas y un espejo de agua duplica la casa; bajo los pinos, dos círculos de grava guardan el fuego.',r:['2022-cch-1','2022-cch-2','2022-cch-3','2022-cch-4','2022-cch-5','2022-cch-6']},
 {id:'sp-2022',n:'S.P.',a:2022,t:'Residencial',x:'Un jardín de estaciones. El cerezo marca el ritmo del año, las rocas lo detienen y los pasos de laja dibujan una ruta lenta que termina en el agua.',r:['2022-sp-1','2022-sp-2','2022-sp-3','2022-sp-4','2022-sp-5','2022-sp-6']},
 {id:'cm-2022',n:'C.M.',a:2022,t:'Residencial',x:'La casa de patio pedía un jardín de claustro. Lavandas en masa contra los muros blancos, grava para la llegada y, al centro, un solo árbol que ordena todo.',r:['2022-cm-1','2022-cm-2','2022-cm-3','2022-cm-4','2022-cm-5','2022-cm-6']},
 {id:'mc-2022',n:'M.C.',a:2022,t:'Terraza',x:'Una azotea en plena ciudad convertida en jardín. Un sofá curvo abraza el fuego sobre la madera, un muro verde con flores rojas cierra el fondo y jardineras de gramíneas y arbustos redondos suavizan los bordes.',r:['2022-mc-1','2022-mc-2','2022-mc-3','2022-mc-4','2022-mc-5','2022-mc-6']},
 {id:'ev-2021',n:'E.V.',a:2021,t:'Residencial',x:'La casa no se impone a la ladera: se acomoda en ella. Las perennes suben por el talud y la celosía de ladrillo filtra un patio de sombra donde la luz llega a pedazos.',r:['2021-ev-1','2021-ev-2','2021-ev-3','2021-ev-4','2021-ev-5','2021-ev-6']},
 {id:'lu-2021',n:'L.U.',a:2021,t:'Residencial',x:'Las terrazas de la casa se repiten en el jardín. Bordes de perennes que bajan la pendiente en franjas, como curvas de nivel, hasta disolverse en el prado.',r:['2021-lu-1','2021-lu-2','2021-lu-3','2021-lu-4','2021-lu-5']},
 {id:'ind-2021',n:'IND.',a:2021,t:'Industrial',x:'Una nave de escala enorme, resuelta con una idea simple: que el bosque la abrace. El acceso se vuelve alameda y las copas bajan la escala de la industria a la del cuerpo.',r:['2021-ind-1','2021-ind-2','2021-ind-3','2021-ind-4','2021-ind-5']}
];
function lista(el,arr){
  el.innerHTML=arr.map((j,i)=>`<a href="#${j.id}" data-id="${j.id}">${i===0||arr[i-1].a!==j.a?`<sup>${j.a}</sup>`:''}${j.n}</a><span class="p">${i<arr.length-1?', ':(j.n.endsWith('.')?'':'.')}</span>`).join('');
}
lista(document.getElementById('proyectos'),[...J].sort((a,b)=>a.a-b.a));
const url=f=>`/promesas/${f}.jpg`;
// vista previa al pasar: el primer render
const prev=document.getElementById('prev');
document.querySelectorAll('.lista a').forEach(a=>{
  const j=J.find(x=>x.id===a.dataset.id);
  a.addEventListener('mouseenter',()=>{prev.style.backgroundImage=`url(${url(j.r[0])})`;prev.style.opacity=1});
  a.addEventListener('mouseleave',()=>prev.style.opacity=0);
  a.addEventListener('mousemove',e=>{prev.style.left=(e.clientX+24)+'px';prev.style.top=(e.clientY-120)+'px'});
});
const ficha=document.getElementById('ficha'),tira=document.getElementById('tira'),fl=document.getElementById('flechas');
function abrir(id){
  const j=J.find(x=>x.id===id); if(!j) return cerrar();
  document.getElementById('f-nombre').textContent=j.n;
  document.getElementById('f-anio').textContent=j.a;
  document.getElementById('f-tipo').textContent=j.t;
  document.getElementById('f-texto').textContent=j.x;
  tira.innerHTML=j.r.map((f,i)=>`<div class="cuadro" role="img" aria-label="render ${j.n} ${i+1}" style="background-image:url(${url(f)})"><span>${String(i+1).padStart(2,'0')} / ${String(j.r.length).padStart(2,'0')}</span></div>`).join('');
  ficha.classList.add('on'); tira.scrollTo({left:0,behavior:'instant'}); requestAnimationFrame(()=>tira.scrollTo({left:0,behavior:'instant'})); fl.hidden=j.r.length<2; document.body.style.overflow='hidden';
  document.title=j.n+' · Promesas · FORA';
}
function cerrar(){tira.scrollTo({left:0,behavior:'instant'});ficha.classList.remove('on');fl.hidden=true;document.body.style.overflow='';document.title='Promesas · FORA';if(location.hash)history.pushState('',document.title,location.pathname)}
window.addEventListener('hashchange',()=>location.hash?abrir(location.hash.slice(1)):cerrar());
if(location.hash) abrir(location.hash.slice(1));
document.getElementById('cerrar').onclick=cerrar;
document.addEventListener('keydown',e=>{if(!ficha.classList.contains('on'))return;if(e.key==='Escape')cerrar();if(e.key==='ArrowRight')tira.scrollBy({left:innerWidth*.6,behavior:'smooth'});if(e.key==='ArrowLeft')tira.scrollBy({left:-innerWidth*.6,behavior:'smooth'})});
document.getElementById('sig').onclick=()=>tira.scrollBy({left:innerWidth*.6,behavior:'smooth'});
document.getElementById('ant').onclick=()=>tira.scrollBy({left:-innerWidth*.6,behavior:'smooth'});
tira.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&innerWidth>760){tira.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
</script>
</body>
</html>
