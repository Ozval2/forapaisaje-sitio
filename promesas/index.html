<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promesas · FORA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231F20">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fora.css">
<style>
:root{--piedra:#231F20;--crema:#F4EFE4;--suave:#E4DED2;--gris:#A9A397;--desc:#B8B2A6;--linea:rgba(244,239,228,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--piedra);color:var(--crema);font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:center;padding:40px 24px 0}
.top img{height:30px;width:auto;display:block}
.aviso{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-top:18px}
main{max-width:1180px;margin:0 auto;padding:clamp(72px,14vh,160px) 24px 120px}
.cab{max-width:620px;margin-bottom:clamp(72px,12vh,140px)}
h1{font-family:"Fora Display",Inter,sans-serif;font-weight:300;text-transform:lowercase;font-size:clamp(30px,3.4vw,40px);line-height:1.3}
.intro{font-size:13px;line-height:2.1;letter-spacing:.06em;color:var(--suave);margin-top:28px;max-width:500px}
.anio{display:grid;grid-template-columns:28px 1fr;gap:20px;margin-bottom:clamp(80px,12vh,140px)}
.anio .et{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);align-self:start;position:sticky;top:40px}
.reja{display:grid;grid-template-columns:repeat(12,1fr);column-gap:clamp(12px,1.6vw,24px);row-gap:clamp(40px,6vh,72px)}
figure{cursor:zoom-in}
figure .img{width:100%;aspect-ratio:16/9;background:#2c2728 center/cover no-repeat;transition:opacity .6s}
figure .img.carga{opacity:0}
figcaption{display:flex;justify-content:space-between;margin-top:12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris)}
/* ritmo editorial: grande, par, desplazada, par */
.reja figure:nth-child(6n+1){grid-column:1/13}
.reja figure:nth-child(6n+2){grid-column:1/7}
.reja figure:nth-child(6n+3){grid-column:7/13;margin-top:clamp(40px,8vh,96px)}
.reja figure:nth-child(6n+4){grid-column:4/13}
.reja figure:nth-child(6n+5){grid-column:1/8}
.reja figure:nth-child(6n+6){grid-column:8/13;align-self:end}
nav.pie{display:flex;justify-content:center;gap:44px;padding:0 24px 56px;flex-wrap:wrap}
nav.pie a{font-size:11px;letter-spacing:.34em;text-transform:uppercase;padding:12px 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav.pie a:hover{border-color:var(--linea)}
/* visor */
#visor{position:fixed;inset:0;background:var(--piedra);z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;padding:64px 96px 40px}
#visor.on{display:flex}
#visor img{max-width:100%;max-height:calc(100vh - 140px);display:block}
#visor p{margin-top:16px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris)}
#visor button{position:absolute;background:none;border:0;color:var(--crema);cursor:pointer;font-family:inherit}
#visor .x{top:22px;right:28px;font-size:11px;letter-spacing:.34em;text-transform:uppercase}
#visor .ant,#visor .sig{top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--linea);border-radius:50%;font-size:16px}
#visor .ant{left:24px}#visor .sig{right:24px}
@media(max-width:760px){
  .anio{grid-template-columns:1fr;gap:16px}
  .anio .et{writing-mode:horizontal-tb;transform:none;position:static}
  .reja figure:nth-child(n){grid-column:1/13;margin-top:0}
  nav.pie{gap:28px}
  #visor{padding:64px 16px 40px}
  #visor .ant,#visor .sig{display:none}
}
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="FORA, inicio"><img src="/logo-fora-palabra.svg" alt="Fora"></a></header>
<p class="aviso">borrador</p>
<main>
  <div class="cab">
    <h1>promesas.</h1>
    <p class="intro">Antes de que exista el jardín, existe el dibujo. Estas imágenes son lo que prometimos: algunas ya crecen, otras siguen esperando su tierra.</p>
  </div>
  <div id="anios"></div>
</main>
<nav class="pie"><a href="/">Inicio</a><a href="https://www.instagram.com/fora_paisajismo/" rel="noopener">Instagram</a><a href="mailto:hola@forapaisaje.com">Escríbenos</a></nav>
<div id="visor" role="dialog" aria-modal="true" aria-label="render">
  <button class="x" type="button">cerrar</button>
  <button class="ant" type="button" aria-label="anterior">←</button>
  <img alt="">
  <p></p>
  <button class="sig" type="button" aria-label="siguiente">→</button>
</div>
<script>
// renders: siglas del proyecto, año y archivo. Nunca nombres de clientes.
const P=[
 {a:2021,s:'L.U.',f:'2021-lu-1'},
 {a:2021,s:'L.U.',f:'2021-lu-2'},
 {a:2021,s:'L.U.',f:'2021-lu-3'},
 {a:2021,s:'IND.',f:'2021-ind-1'},
 {a:2021,s:'L.U.',f:'2021-lu-4'},
 {a:2021,s:'L.U.',f:'2021-lu-5'}
];
const cont=document.getElementById('anios');
const anios=[...new Set(P.map(p=>p.a))].sort((x,y)=>y-x);
anios.forEach(a=>{
  const sec=document.createElement('section');sec.className='anio';
  sec.innerHTML=`<span class="et">${a}</span><div class="reja"></div>`;
  const reja=sec.querySelector('.reja');
  P.filter(p=>p.a===a).forEach(p=>{
    const i=P.indexOf(p);
    const fig=document.createElement('figure');
    fig.innerHTML=`<div class="img carga" role="img" aria-label="render ${p.s} ${p.a}"></div><figcaption><span>${p.s}</span><span>render · ${p.a}</span></figcaption>`;
    fig.onclick=()=>abrir(i);
    reja.appendChild(fig);
    const d=fig.querySelector('.img');
    new IntersectionObserver((es,o)=>{es.forEach(e=>{if(e.isIntersecting){const im=new Image();im.onload=()=>{d.style.backgroundImage=`url(/promesas/${p.f}.jpg)`;d.classList.remove('carga')};im.src=`/promesas/${p.f}.jpg`;o.disconnect()}})},{rootMargin:'300px'}).observe(d);
  });
  cont.appendChild(sec);
});
const V=document.getElementById('visor'),vi=V.querySelector('img'),vp=V.querySelector('p');let cur=0;
function abrir(i){cur=(i+P.length)%P.length;const p=P[cur];vi.src=`/promesas/${p.f}.jpg`;vi.alt=`render ${p.s} ${p.a}`;vp.textContent=`${p.s} · render · ${p.a}`;V.classList.add('on');document.body.style.overflow='hidden'}
function cerrar(){V.classList.remove('on');document.body.style.overflow=''}
V.querySelector('.x').onclick=cerrar;
V.querySelector('.ant').onclick=e=>{e.stopPropagation();abrir(cur-1)};
V.querySelector('.sig').onclick=e=>{e.stopPropagation();abrir(cur+1)};
V.onclick=e=>{if(e.target===V)cerrar()};
document.addEventListener('keydown',e=>{if(!V.classList.contains('on'))return;if(e.key==='Escape')cerrar();if(e.key==='ArrowLeft')abrir(cur-1);if(e.key==='ArrowRight')abrir(cur+1)});
let x0=null;V.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
V.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)abrir(cur+(dx<0?1:-1));x0=null});
</script>
</body>
</html>
